<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Application Closed</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --brand-red: #c10000;
      --brand-red-dark: #a80000;
      --light-bg: #fdf6f6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--light-bg);
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: #fff;
      padding: clamp(20px, 4vw, 36px);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(193,0,0,0.08);
      width: 100%;
      max-width: 420px;
      text-align: center;
      border: 2px solid var(--brand-red);
    }

    .brand-logo {
      display: block;
      margin: 0 auto 18px;
      width: clamp(70px, 25%, 110px);
      height: auto;
      object-fit: contain;
    }

    h2 {
      color: var(--brand-red);
      margin-bottom: 12px;
      font-size: clamp(1.4rem, 2.5vw, 1.8rem);
      font-weight: 700;
    }

    p {
      color: #333;
      font-size: clamp(0.95rem, 2vw, 1.05rem);
      margin: 8px 0;
      line-height: 1.5;
    }

    /* Ultra small devices */
    @media (max-width: 360px) {
      .container {
        padding: 16px;
      }

      h2 {
        font-size: 1.3rem;
      }
    }

    /* Large screens (make it not look tiny) */
    @media (min-width: 1200px) {
      .container {
        max-width: 480px;
      }
    }

  </style>
</head>

<body>

  <div class="container">
    <img 
      src="https://minet-zambia-insurance-brokers.github.io/supplier-registration-form/Minet%20Emblem.png"
      alt="Minet Logo"
      class="brand-logo"
      loading="lazy"
    >

    <h2>Application Closed</h2>

    <p><strong>Minet Zambia Supplier Registration</strong></p>

    <p>Thank you for your interest. The supplier registration application is currently closed.</p>

    <p>Please check back later for future opportunities.</p>

  </div>

</body>
</html>
